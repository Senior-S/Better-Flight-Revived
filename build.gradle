        [slug: 'trinkets', type: 'optionalDependency'],
        [slug: 'beans-backpacks', type: 'optionalDependency']
])

publishCurseForgeVersionTask('neoforge', "neoforge/build/libs/${archives_name}-neoforge-${mod_version}.jar", [curseForgeMinecraft1211, curseForgeNeoForge, curseForgeClient, curseForgeServer], [
        [slug: 'architectury-api', type: 'requiredDependency'],
        [slug: 'yacl', type: 'requiredDependency'],
        [slug: 'curios', type: 'optionalDependency'],
        [slug: 'beans-backpacks', type: 'optionalDependency']
])

tasks.register('publishCurseForge') {
    group = 'publishing'
    description = 'Builds and publishes Fabric and NeoForge jars to CurseForge.'
    dependsOn 'publishCurseForgeFabric', 'publishCurseForgeNeoforge'
}
