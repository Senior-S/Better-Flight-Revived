plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
        maven { url = 'https://maven.ladysnake.org/releases/' }
        maven {
            name = 'Xander Maven'
            url = 'https://maven.isxander.dev/releases'
        }
        maven {
            name = 'Kotlin for Forge'
            url = 'https://thedarkcolour.github.io/KotlinForForge/'
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

def modrinthApi = 'https://api.modrinth.com/v2'
def modrinthProjectId = 'rfnJO0zi'
def modrinthProjectSlug = 'better-flight-revived'
def modrinthUserAgent = 'Senior-S/Better-Flight-Revived local release'
def curseForgeApi = 'https://minecraft.curseforge.com/api'
def curseForgeProjectId = 1538652
def curseForgeMinecraft1211 = 11779
def curseForgeFabric = 7499
def curseForgeNeoForge = 10150
def curseForgeClient = 9638
def curseForgeServer = 9639
def modrinthDescription = '''# Better Flight Revived

**Better Flight Revived** brings the classic [Better Flight Forge](https://www.curseforge.com/minecraft/mc-mods/better-flight-forge) experience forward to **Minecraft 1.21.1** with modern Fabric and NeoForge support.

Vanilla Elytra are great, but they lean heavily on fireworks. This mod makes flight feel more active and skill-based with takeoff, flapping, flaring, stamina management, and HUD feedback.

[Join the Discord](https://discord.gg/6c6cDU2mKj)

## What It Adds

- **Sprint + double jump takeoff** for smoother Elytra launches.
- **Wing flapping** for controlled lift without relying entirely on fireworks.
- **Modern boost mode** for stronger near-ground movement.
- **Flare braking** by holding `X` while flying, making landings easier and more controlled.
- **Flight stamina** so long-distance flight has a light survival cost.
- **HUD feedback** for stamina and Elytra durability.
- **Configurable behavior** for costs, recharge speed, hunger exhaustion, ceiling limits, and extra wing items.

## Compatibility

Better Flight Revived supports both major mod loaders for Minecraft 1.21.1:

- **Fabric**
- **NeoForge**

It also detects Elytra-style equipment from supported slot/backpack mods:

- **Trinkets** on Fabric
- **Curios API** on NeoForge
- **Beans Backpacks 3** on Fabric and NeoForge

## Requirements

### Fabric

- Minecraft **1.21.1**
- Java **21**
- Fabric Loader **0.19.2+**
- Fabric API
- Architectury API **13.0.8+**

### NeoForge

- Minecraft **1.21.1**
- Java **21**
- NeoForge **21.1+**
- Architectury API **13.0.8+**

## Optional Integrations

- Trinkets **3.10.0+**
- Curios API **9.5.1+**
- Beans Backpacks 3 **0.12+**

## Credits

- **Rejah Tavi** for the original Better Flight mod.
- **ArkVeil** for prior Better Flight work.
- **SeniorS** for reviving and porting the mod to Minecraft 1.21.1.

## Support

Found a bug, balance issue, or compatibility problem? Open an issue on GitHub or join the Discord.

- [GitHub Issues](https://github.com/Senior-S/Better-Flight-Revived/issues)
- [Discord](https://discord.gg/6c6cDU2mKj)
'''

def modrinthToken = {
    def token = System.getenv('MODRINTH_TOKEN') ?: findProperty('modrinthToken')
    if (!token) {
        throw new GradleException('MODRINTH_TOKEN environment variable or -PmodrinthToken is required.')
    }
    token
}

def curseForgeToken = {
    def token = System.getenv('CURSEFORGE_TOKEN') ?: System.getenv('CURSEFORGE_API_TOKEN') ?: findProperty('curseForgeToken')
    if (!token) {
        throw new GradleException('CURSEFORGE_TOKEN environment variable or -PcurseForgeToken is required.')
    }
    token
}

def curseForgeProject = {
    System.getenv('CURSEFORGE_PROJECT_ID') ?: findProperty('curseForgeProjectId') ?: curseForgeProjectId
}

def requestJson = { String method, String endpoint, Map payload = null ->
    List<String> command = [
            'curl', '-sS', '--fail-with-body',
            '-X', method,
            "${modrinthApi}${endpoint}",
            '-H', "Authorization: ${modrinthToken()}",
            '-H', "User-Agent: ${modrinthUserAgent}",
            '-H', 'Content-Type: application/json'
    ]
    if (payload != null) {
        File payloadFile = File.createTempFile('betterflight-modrinth-', '.json')
        payloadFile.text = JsonOutput.toJson(payload)
        command += ['--data-binary', "@${payloadFile.absolutePath}"]
    }

    ByteArrayOutputStream stdout = new ByteArrayOutputStream()
    ByteArrayOutputStream stderr = new ByteArrayOutputStream()
    def result = exec {
        commandLine command
        standardOutput = stdout
        errorOutput = stderr
        ignoreExitValue = true
    }
    result.rethrowFailure()
    if (result.exitValue != 0) {
        throw new GradleException("Modrinth API curl failed with exit ${result.exitValue}: ${stdout.toString('UTF-8')}${stderr.toString('UTF-8')}")
    }

    String text = stdout.toString('UTF-8')
    text ? new JsonSlurper().parseText(text) : null
}

def requestMultipart = { String method, String endpoint, Map data, Map<String, File> files ->
    File payloadFile = File.createTempFile('betterflight-modrinth-', '.json')
    payloadFile.text = JsonOutput.toJson(data)

    List<String> command = [
            'curl', '-sS', '--fail-with-body',
            '-X', method,
            "${modrinthApi}${endpoint}",
            '-H', "Authorization: ${modrinthToken()}",
            '-H', "User-Agent: ${modrinthUserAgent}",
            '-F', "data=<${payloadFile.absolutePath};type=application/json"
    ]
    files.each { String partName, File file ->
        command += ['-F', "${partName}=@${file.absolutePath}"]
    }

    ByteArrayOutputStream stdout = new ByteArrayOutputStream()
    ByteArrayOutputStream stderr = new ByteArrayOutputStream()
    def result = exec {
        commandLine command
        standardOutput = stdout
        errorOutput = stderr
        ignoreExitValue = true
    }
    result.rethrowFailure()
    if (result.exitValue != 0) {
        throw new GradleException("Modrinth API curl failed with exit ${result.exitValue}: ${stdout.toString('UTF-8')}${stderr.toString('UTF-8')}")
    }

    String text = stdout.toString('UTF-8')
    text ? new JsonSlurper().parseText(text) : null
}

def requestCurseForgeMultipart = { String endpoint, Map metadata, File file ->
    File payloadFile = File.createTempFile('betterflight-curseforge-', '.json')
    payloadFile.text = JsonOutput.toJson(metadata)

    List<String> command = [
            'curl', '-L', '-sS', '--fail-with-body',
            '-X', 'POST',
            "${curseForgeApi}${endpoint}",
            '-H', "X-Api-Token: ${curseForgeToken()}",
            '-F', "metadata=<${payloadFile.absolutePath};type=application/json",
            '-F', "file=@${file.absolutePath}"
    ]

    ByteArrayOutputStream stdout = new ByteArrayOutputStream()
    ByteArrayOutputStream stderr = new ByteArrayOutputStream()
    def result = exec {
        commandLine command
        standardOutput = stdout
        errorOutput = stderr
        ignoreExitValue = true
    }
    result.rethrowFailure()
    if (result.exitValue != 0) {
        throw new GradleException("CurseForge API curl failed with exit ${result.exitValue}: ${stdout.toString('UTF-8')}${stderr.toString('UTF-8')}")
    }

    String text = stdout.toString('UTF-8')
    text ? new JsonSlurper().parseText(text) : null
}

def projectPayload = {
    [
            slug        : modrinthProjectSlug,
            title       : 'Better Flight Revived',
            description : 'Active Elytra flight with takeoff, flapping, flaring, stamina, and HUD feedback.',
            categories  : ['adventure', 'equipment', 'utility'],
            client_side : 'required',
            server_side : 'optional',
            body        : modrinthDescription,
            license_id  : 'GPL-3.0-only',
            project_type: 'mod',
            issues_url  : 'https://github.com/Senior-S/Better-Flight-Revived/issues',
            source_url  : 'https://github.com/Senior-S/Better-Flight-Revived',
            discord_url : 'https://discord.gg/6c6cDU2mKj'
    ]
}

tasks.register('syncModrinthProject') {
    group = 'publishing'
    description = 'Updates the Modrinth project page.'

    doLast {
        Map payload = projectPayload()
        Map updatePayload = new LinkedHashMap(payload)
        updatePayload.remove('slug')
        updatePayload.remove('project_type')
        def project = requestJson('PATCH', "/project/${modrinthProjectId}", updatePayload)
        if (project == null) {
            project = requestJson('GET', "/project/${modrinthProjectId}")
        }
        logger.lifecycle("Synced Modrinth project ${project.slug} (${project.id})")
    }
}

def publishModrinthVersionTask = { String loaderName, String versionSuffix, String jarPath, List<Map> dependencies ->
    tasks.register("publishModrinth${loaderName.capitalize()}") {
        group = 'publishing'
        description = "Publishes the ${loaderName} jar to Modrinth."
        dependsOn 'syncModrinthProject', ":${loaderName}:build"

        doLast {
            File jar = file(jarPath)
            if (!jar.exists()) {
                throw new GradleException("Expected release jar does not exist: ${jar}")
            }

            String changelog = findProperty('modrinthChangelog') ?: "Better Flight Revived ${version} for Minecraft ${minecraft_version}."
            String releaseType = findProperty('modrinthReleaseType') ?: 'release'
            Map payload = [
                    name          : "Better Flight Revived ${version} ${loaderName.capitalize()}",
                    version_number: "${version}+${versionSuffix}",
                    changelog     : changelog,
                    dependencies  : dependencies,
                    game_versions : [minecraft_version],
                    version_type  : releaseType,
                    loaders       : [loaderName],
                    featured      : true,
                    status        : 'listed',
                    project_id    : modrinthProjectId,
                    file_parts    : ['file'],
                    primary_file  : 'file'
            ]

            requestMultipart('POST', '/version', payload, ['file': jar])
            logger.lifecycle("Published ${jar.name} to Modrinth")
        }
    }
}

publishModrinthVersionTask('fabric', 'fabric', "fabric/build/libs/${archives_name}-fabric-${mod_version}.jar", [
        [project_id: 'P7dR8mSH', dependency_type: 'required'],
        [project_id: 'lhGA9TYQ', dependency_type: 'required'],
        [project_id: '1eAoo2KR', dependency_type: 'required'],
        [project_id: '5aaWibi9', dependency_type: 'optional'],
        [project_id: 'o4TtgIhD', dependency_type: 'optional']
])

publishModrinthVersionTask('neoforge', 'neoforge', "neoforge/build/libs/${archives_name}-neoforge-${mod_version}.jar", [
        [project_id: 'lhGA9TYQ', dependency_type: 'required'],
        [project_id: '1eAoo2KR', dependency_type: 'required'],
        [project_id: 'vvuO3ImH', dependency_type: 'optional'],
        [project_id: 'o4TtgIhD', dependency_type: 'optional']
])

tasks.register('requestModrinthReview') {
    group = 'publishing'
    description = 'Requests Modrinth review for the project.'
    dependsOn 'publishModrinthFabric', 'publishModrinthNeoforge'

    doLast {
        requestJson('PATCH', "/project/${modrinthProjectId}", [requested_status: 'approved'])
        logger.lifecycle('Requested Modrinth review')
    }
}

tasks.register('publishModrinth') {
    group = 'publishing'
    description = 'Builds, publishes Fabric and NeoForge jars to Modrinth, and requests project review.'
    dependsOn 'requestModrinthReview'
}

def publishCurseForgeVersionTask = { String loaderName, String jarPath, List<Integer> gameVersionIds, List<Map> relations ->
    tasks.register("publishCurseForge${loaderName.capitalize()}") {
        group = 'publishing'
        description = "Publishes the ${loaderName} jar to CurseForge."
        dependsOn ":${loaderName}:build"

        doLast {
            File jar = file(jarPath)
            if (!jar.exists()) {
                throw new GradleException("Expected release jar does not exist: ${jar}")
            }

            String changelog = findProperty('curseForgeChangelog') ?: findProperty('modrinthChangelog') ?: "Better Flight Revived ${version} for Minecraft ${minecraft_version}."
            String releaseType = findProperty('curseForgeReleaseType') ?: findProperty('modrinthReleaseType') ?: 'release'
            String displayLoader = loaderName == 'neoforge' ? 'NeoForge' : 'Fabric'
            Map metadata = [
                    changelog    : changelog,
                    changelogType: 'markdown',
                    displayName  : "Better Flight Revived ${version} ${displayLoader}",
                    gameVersions : gameVersionIds,
                    releaseType  : releaseType,
                    relations    : [projects: relations]
            ]

            def response = requestCurseForgeMultipart("/projects/${curseForgeProject()}/upload-file", metadata, jar)
            logger.lifecycle("Published ${jar.name} to CurseForge as file ${response?.id ?: '(unknown id)'}")
        }
    }
}

publishCurseForgeVersionTask('fabric', "fabric/build/libs/${archives_name}-fabric-${mod_version}.jar", [curseForgeMinecraft1211, curseForgeFabric, curseForgeClient, curseForgeServer], [
