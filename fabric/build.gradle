plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modApi "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    modImplementation "dev.isxander:yet-another-config-lib:$rootProject.yacl_version-fabric"
    modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"
    modCompileOnly("dev.emi:trinkets:$rootProject.trinkets_version") { transitive = false }
    modCompileOnly("org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cardinal_components_version") { transitive = false }
    modCompileOnly("org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.cardinal_components_version") { transitive = false }
    modCompileOnly("maven.modrinth:beans-backpacks-3:$rootProject.beans_backpacks_fabric_version") { transitive = false }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
